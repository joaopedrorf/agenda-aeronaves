{% extends 'base.html' %}
{% block titulo %}{{ t.menu_senha }}{% endblock %}

{% block conteudo %}
<form method="POST" class="cartao formulario-reserva formulario-senha">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div>
        <a class="link-voltar" href="{{ url_for('agenda') }}">{{ t.voltar_agenda }}</a>
        <h1>{{ t.menu_senha }}</h1>
    </div>
    <div class="campo">
        <label for="atual">{{ t.senha_atual }}</label>
        <input type="password" id="atual" name="atual" required autocomplete="current-password">
    </div>
    <div class="campo">
        <label for="nova">{{ t.senha_nova }}</label>
        <input type="password" id="nova" name="nova" required minlength="8" autocomplete="new-password" aria-describedby="dica-senha">
        <span class="apagado" id="dica-senha">{{ t.senha_dica }}</span>
    </div>
    <div class="campo">
        <label for="confirmar">{{ t.senha_confirmar }}</label>
        <input type="password" id="confirmar" name="confirmar" required minlength="8" autocomplete="new-password">
    </div>
    <button type="submit" class="botao-grande">{{ t.salvar }}</button>
</form>
{% endblock %}
